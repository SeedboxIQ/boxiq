<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BoxIQ label sheets</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1F211E; --ink-soft:#4A4E48; --seed:#8FB53C; --seed-deep:#5A7A1E;
    --plate:#F2F2EE; --steel:#6E7472; --steel-line:#C9CBC5; --page:#E4E5E0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 'Archivo',system-ui,sans-serif}
  .bar{background:var(--ink);color:var(--plate);padding:13px 0}
  .wrap{max-width:960px;margin:0 auto;padding:0 20px}
  .mark{font-weight:700;font-size:20px;letter-spacing:-.03em}
  .mark .sprout{color:var(--seed)}
  .mark .dot{color:var(--steel);padding:0 2px}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#9BA09A;margin-top:8px}

  form{background:#fff;border:1px solid var(--steel-line);border-radius:4px;padding:22px;margin:26px 0 22px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  label.f{display:block;margin-bottom:16px}
  label.f > span{
    display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.15em;
    text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;
  }
  input[type=text],textarea,select{
    width:100%;font:15px/1.45 'IBM Plex Mono',monospace;color:var(--ink);
    border:1.5px solid var(--steel-line);border-radius:3px;padding:11px 12px;background:var(--plate);
  }
  input:focus,textarea:focus,select:focus{outline:2px solid var(--seed);outline-offset:1px;border-color:var(--seed-deep)}
  textarea{min-height:104px;resize:vertical}
  .hint{font-size:12.5px;color:var(--ink-soft);margin:6px 0 0}
  .check{display:flex;align-items:center;gap:9px;margin:2px 0 18px;font-size:14.5px}
  .check input{width:18px;height:18px;accent-color:var(--seed-deep)}
  .btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  button{
    font:600 15px 'Archivo',sans-serif;border:1.5px solid var(--ink);border-radius:3px;
    padding:13px 18px;cursor:pointer;background:transparent;color:var(--ink);min-height:48px;
  }
  button.go{background:var(--seed);color:var(--ink)}
  button:focus-visible{outline:3px solid var(--seed-deep);outline-offset:2px}
  .note{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);margin-left:auto}

  h2.sheet-title{font-size:16px;margin:0 0 4px}
  p.sheet-sub{margin:0 0 20px;color:var(--ink-soft);font-size:13.5px}

  /* ---------- labels ---------- */
  #sheet{display:grid;gap:16px}
  #sheet.cards{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  #sheet.strips{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .label{background:#fff;border:1px solid var(--steel-line);border-radius:4px;padding:16px;break-inside:avoid}
  .label .kind{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel);margin-bottom:11px}
  .label .qr{color:var(--ink)}
  .label .qr svg{display:block;width:100%;height:auto}
  .plate{
    display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--plate);
    border:1px solid var(--steel-line);border-radius:3px;padding:6px 8px;margin-top:12px;
  }
  .rivet{width:9px;height:9px;border-radius:50%;flex:none;
    background:radial-gradient(circle at 35% 30%,#fff 0 18%,#B9BCB6 55%,#7E837C 100%)}
  .id{font:600 14px/1 'IBM Plex Mono',monospace;letter-spacing:.1em}
  .cap{font-size:11.5px;color:var(--ink-soft);margin-top:8px;line-height:1.35}

  #sheet.strips .label{display:grid;grid-template-columns:88px 1fr;gap:14px;align-items:center}
  #sheet.strips .kind{grid-column:1 / -1;margin:0}
  #sheet.strips .plate{margin:0}
  #sheet.strips .cap{margin:6px 0 0}

  .empty{background:#fff;border:1px dashed var(--steel-line);border-radius:4px;padding:26px;text-align:center;color:var(--ink-soft)}

  @media print{
    @page{ margin:12mm; }
    body{background:#fff}
    .bar,form,.screen-only{display:none !important}
    .wrap{max-width:none;padding:0}
    #sheet{gap:8mm}
    #sheet.cards{grid-template-columns:repeat(3,1fr)}
    #sheet.strips{grid-template-columns:repeat(2,1fr)}
    .label{border-color:#999;padding:5mm}
    #sheet.cards .qr svg{width:38mm}
    #sheet.strips .label{grid-template-columns:24mm 1fr}
  }
</style>
</head>
<body>

<div class="bar"><div class="wrap">
  <div class="mark">seedb<span class="sprout">o</span>x<span class="dot">·</span>BoxIQ</div>
  <div class="eyebrow">Label sheets</div>
</div></div>

<div class="wrap">
<form id="form" onsubmit="return false">
  <div class="row">
    <label class="f"><span>Client folder</span>
      <input type="text" id="slug" value="aurora" spellcheck="false" autocapitalize="off">
      <p class="hint">The folder name in the repo — <code>aurora</code>, <code>becks</code>, <code>bayer</code>.</p>
    </label>
    <label class="f"><span>Label style</span>
      <select id="style">
        <option value="cards">Cards — 3 across, big codes</option>
        <option value="strips">Strips — narrow, like the slidegate plate</option>
      </select>
      <p class="hint">Cards scan from further away. Strips fit on a gate.</p>
    </label>
  </div>

  <label class="f"><span>Gate IDs</span>
    <textarea id="gates" spellcheck="false" autocapitalize="characters">SG01001091
SG01001093</textarea>
    <p class="hint">One per line, or separated by commas. Bare digits are fine.</p>
  </label>

  <div class="check">
    <input type="checkbox" id="sticker" checked>
    <label for="sticker">Include the box sticker code (opens BoxIQ with nothing looked up)</label>
  </div>

  <div class="btns">
    <button type="button" class="go" id="build">Build sheet</button>
    <button type="button" id="loadAll">Load every gate in this client's list</button>
    <button type="button" id="print">Print</button>
    <span class="note" id="base"></span>
  </div>
</form>

<div class="screen-only">
  <h2 class="sheet-title" id="title">Nothing built yet</h2>
  <p class="sheet-sub" id="sub">Codes are live the moment the client folder is pushed to GitHub Pages.</p>
</div>

<div id="sheet" class="cards">
  <div class="empty">Set a client folder and gate IDs, then build the sheet.</div>
</div>
</div>

<script>
/* ============================================================
   BoxIQ QR encoder — no dependencies, no CDN, works offline.
   Byte mode, error correction level M, versions 1-10 (up to 213
   bytes), which covers every BoxIQ URL with room to spare.

   BoxIQQR.svgPath("https://…") -> { size, path }
     size  modules across, including the 4-module quiet zone
     path  an SVG path string, one square per dark module
   ============================================================ */
(function(global){
'use strict';

/* ---------- GF(256) arithmetic ---------- */
function mul(a, b){
  let z = 0;
  for(let i = 7; i >= 0; i--){
    z = ((z << 1) ^ ((z >>> 7) * 0x11D)) & 0xFF;
    z ^= ((b >>> i) & 1) * a;
  }
  return z;
}

/* ---------- Reed-Solomon ---------- */
function rsDivisor(degree){
  const result = new Uint8Array(degree);
  result[degree - 1] = 1;
  let root = 1;
  for(let i = 0; i < degree; i++){
    for(let j = 0; j < degree; j++){
      result[j] = mul(result[j], root);
      if(j + 1 < degree) result[j] ^= result[j + 1];
    }
    root = mul(root, 0x02);
  }
  return result;
}
function rsRemainder(data, divisor){
  const result = new Uint8Array(divisor.length);
  for(const b of data){
    const factor = b ^ result[0];
    result.copyWithin(0, 1);
    result[result.length - 1] = 0;
    for(let i = 0; i < result.length; i++) result[i] ^= mul(divisor[i], factor);
  }
  return result;
}

/* ---------- capacity tables, error correction level M ---------- */
const ECC_PER_BLOCK = [null,10,16,26,18,24,16,18,22,22,26];
const NUM_BLOCKS    = [null, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5];
const MAX_VERSION   = 10;

function rawDataModules(ver){
  let result = (16 * ver + 128) * ver + 64;
  if(ver >= 2){
    const numAlign = Math.floor(ver / 7) + 2;
    result -= (25 * numAlign - 10) * numAlign - 55;
    if(ver >= 7) result -= 36;
  }
  return result;
}
const dataCodewords = ver =>
  Math.floor(rawDataModules(ver) / 8) - ECC_PER_BLOCK[ver] * NUM_BLOCKS[ver];

function alignPositions(ver){
  if(ver === 1) return [];
  const numAlign = Math.floor(ver / 7) + 2;
  const step = Math.ceil((ver * 4 + 4) / (numAlign * 2 - 2)) * 2;
  const size = ver * 4 + 17;
  const result = [6];
  for(let pos = size - 7; result.length < numAlign; pos -= step) result.splice(1, 0, pos);
  return result;
}

/* ---------- bit assembly ---------- */
function encode(text){
  const bytes = new TextEncoder().encode(text);
  let ver = 0;
  for(let v = 1; v <= MAX_VERSION; v++){
    const cci = v < 10 ? 8 : 16;
    if(4 + cci + bytes.length * 8 <= dataCodewords(v) * 8){ ver = v; break; }
  }
  if(!ver) throw new Error('too much data for a version 10 QR code');

  const bits = [];
  const push = (val, len) => { for(let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
  push(0b0100, 4);                          // byte mode
  push(bytes.length, ver < 10 ? 8 : 16);    // character count
  for(const b of bytes) push(b, 8);

  const capacity = dataCodewords(ver) * 8;
  push(0, Math.min(4, capacity - bits.length));           // terminator
  push(0, (8 - bits.length % 8) % 8);                     // pad to a byte
  for(let pad = 0xEC; bits.length < capacity; pad ^= 0xEC ^ 0x11) push(pad, 8);

  const data = new Uint8Array(bits.length / 8);
  bits.forEach((bit, i) => { if(bit) data[i >>> 3] |= 0x80 >>> (i & 7); });
  return { ver, data };
}

/* ---------- interleave data and error correction blocks ---------- */
function addEcc(data, ver){
  const numBlocks = NUM_BLOCKS[ver], eccLen = ECC_PER_BLOCK[ver];
  const rawCodewords = Math.floor(rawDataModules(ver) / 8);
  const numShort = numBlocks - rawCodewords % numBlocks;
  const shortLen = Math.floor(rawCodewords / numBlocks);
  const divisor = rsDivisor(eccLen);

  const blocks = [];
  for(let i = 0, k = 0; i < numBlocks; i++){
    const len = shortLen - eccLen + (i < numShort ? 0 : 1);
    const dat = data.slice(k, k + len); k += len;
    blocks.push({ dat, ecc: rsRemainder(dat, divisor) });
  }
  const out = [];
  for(let i = 0; i < shortLen - eccLen + 1; i++)
    blocks.forEach((b, j) => { if(i < b.dat.length) out.push(b.dat[i]); });
  for(let i = 0; i < eccLen; i++) blocks.forEach(b => out.push(b.ecc[i]));
  return new Uint8Array(out);
}

/* ---------- module placement ---------- */
function buildMatrix(ver, codewords){
  const size = ver * 4 + 17;
  const m = Array.from({length: size}, () => new Int8Array(size).fill(-1)); // -1 = free
  const set = (x, y, dark) => { if(x >= 0 && x < size && y >= 0 && y < size) m[y][x] = dark ? 1 : 0; };

  const finder = (cx, cy) => {
    for(let dy = -4; dy <= 4; dy++) for(let dx = -4; dx <= 4; dx++){
      const d = Math.max(Math.abs(dx), Math.abs(dy));
      set(cx + dx, cy + dy, d !== 2 && d !== 4);
    }
  };
  finder(3, 3); finder(size - 4, 3); finder(3, size - 4);

  for(let i = 8; i < size - 8; i++){ set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }

  const aligns = alignPositions(ver);
  aligns.forEach((cx, i) => aligns.forEach((cy, j) => {
    if((i === 0 && j === 0) || (i === 0 && j === aligns.length - 1) ||
       (i === aligns.length - 1 && j === 0)) return;
    for(let dy = -2; dy <= 2; dy++) for(let dx = -2; dx <= 2; dx++)
      set(cx + dx, cy + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
  }));

  // reserve the format areas (filled in after masking). Index 6 is skipped:
  // the format info steps over the timing patterns rather than overwriting them.
  for(let i = 0; i <= 8; i++){ if(i !== 6){ set(i, 8, false); set(8, i, false); } }
  for(let i = 0; i < 8; i++){ set(size - 1 - i, 8, false); set(8, size - 1 - i, false); }
  set(8, size - 8, true); // dark module

  if(ver >= 7){
    let rem = ver;
    for(let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
    const bitsVal = ver << 12 | rem;
    for(let i = 0; i < 18; i++){
      const bit = ((bitsVal >>> i) & 1) === 1, a = size - 11 + i % 3, b = Math.floor(i / 3);
      set(a, b, bit); set(b, a, bit);
    }
  }

  // zigzag data placement
  let i = 0;
  for(let right = size - 1; right >= 1; right -= 2){
    if(right === 6) right = 5;
    for(let vert = 0; vert < size; vert++){
      for(let j = 0; j < 2; j++){
        const x = right - j;
        const upward = ((right + 1) & 2) === 0;
        const y = upward ? size - 1 - vert : vert;
        if(m[y][x] === -1 && i < codewords.length * 8){
          m[y][x] = ((codewords[i >>> 3] >>> (7 - (i & 7))) & 1) ? 1 : 0;
          i++;
        }
      }
    }
  }
  // the few remainder modules a version leaves over are light
  for(let y = 0; y < size; y++) for(let x = 0; x < size; x++) if(m[y][x] === -1) m[y][x] = 0;
  return m;
}

function isFunctionModule(ver, size, x, y){
  const aligns = alignPositions(ver);
  if(x <= 8 && y <= 8) return true;
  if(x >= size - 8 && y <= 8) return true;
  if(x <= 8 && y >= size - 8) return true;
  if(x === 6 || y === 6) return true;
  if(ver >= 7 && ((x >= size - 11 && y <= 5) || (y >= size - 11 && x <= 5))) return true;
  for(const cx of aligns) for(const cy of aligns){
    if((cx === 6 && cy === 6) || (cx === 6 && cy === aligns[aligns.length-1]) ||
       (cx === aligns[aligns.length-1] && cy === 6)) continue;
    if(Math.abs(x - cx) <= 2 && Math.abs(y - cy) <= 2) return true;
  }
  return false;
}

function applyMask(m, ver, mask){
  const size = m.length;
  for(let y = 0; y < size; y++) for(let x = 0; x < size; x++){
    if(isFunctionModule(ver, size, x, y)) continue;
    let invert;
    switch(mask){
      case 0: invert = (x + y) % 2 === 0; break;
      case 1: invert = y % 2 === 0; break;
      case 2: invert = x % 3 === 0; break;
      case 3: invert = (x + y) % 3 === 0; break;
      case 4: invert = (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0; break;
      case 5: invert = x * y % 2 + x * y % 3 === 0; break;
      case 6: invert = (x * y % 2 + x * y % 3) % 2 === 0; break;
      case 7: invert = ((x + y) % 2 + x * y % 3) % 2 === 0; break;
    }
    if(invert) m[y][x] ^= 1;
  }
}

function drawFormat(m, mask){
  const size = m.length;
  const data = 0b00 << 3 | mask;            // 00 = error correction level M
  let rem = data;
  for(let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
  const bits = ((data << 10) | rem) ^ 0x5412;
  const get = i => ((bits >>> i) & 1) === 1 ? 1 : 0;

  for(let i = 0; i <= 5; i++) m[i][8] = get(i);
  m[7][8] = get(6); m[8][8] = get(7); m[8][7] = get(8);
  for(let i = 9; i < 15; i++) m[8][14 - i] = get(i);

  for(let i = 0; i < 8; i++) m[8][size - 1 - i] = get(i);
  for(let i = 8; i < 15; i++) m[size - 15 + i][8] = get(i);
  m[size - 8][8] = 1;
}

/* ---------- mask scoring ---------- */
function penalty(m){
  const size = m.length;
  let score = 0;
  const runScore = run => run >= 5 ? 3 + (run - 5) : 0;

  for(let y = 0; y < size; y++){
    let run = 1;
    for(let x = 1; x < size; x++){
      if(m[y][x] === m[y][x-1]) run++;
      else { score += runScore(run); run = 1; }
    }
    score += runScore(run);
  }
  for(let x = 0; x < size; x++){
    let run = 1;
    for(let y = 1; y < size; y++){
      if(m[y][x] === m[y-1][x]) run++;
      else { score += runScore(run); run = 1; }
    }
    score += runScore(run);
  }
  for(let y = 0; y < size - 1; y++) for(let x = 0; x < size - 1; x++){
    const v = m[y][x];
    if(v === m[y][x+1] && v === m[y+1][x] && v === m[y+1][x+1]) score += 3;
  }
  const finderish = [1,0,1,1,1,0,1,0,0,0,0];
  const matches = (get, i, len) => {
    if(i + 11 > len) return false;
    for(let k = 0; k < 11; k++) if(get(i + k) !== finderish[k]) return false;
    return true;
  };
  for(let y = 0; y < size; y++){
    const row = i => m[y][i], rev = i => m[y][size - 1 - i];
    for(let x = 0; x < size; x++){ if(matches(row, x, size)) score += 40; if(matches(rev, x, size)) score += 40; }
  }
  for(let x = 0; x < size; x++){
    const col = i => m[i][x], rev = i => m[size - 1 - i][x];
    for(let y = 0; y < size; y++){ if(matches(col, y, size)) score += 40; if(matches(rev, y, size)) score += 40; }
  }
  let dark = 0;
  for(let y = 0; y < size; y++) for(let x = 0; x < size; x++) dark += m[y][x];
  const total = size * size;
  score += Math.floor(Math.abs(dark * 20 - total * 10) / total) * 10;
  return score;
}

/* ---------- public API ---------- */
function modules(text, forceMask){
  const { ver, data } = encode(text);
  const codewords = addEcc(data, ver);
  let best = null;
  const masks = forceMask == null ? [0,1,2,3,4,5,6,7] : [forceMask];
  for(const mask of masks){
    const m = buildMatrix(ver, codewords);
    applyMask(m, ver, mask);
    drawFormat(m, mask);
    const p = penalty(m);
    if(!best || p < best.p) best = { m, p, mask };
  }
  return { modules: best.m, version: ver, mask: best.mask };
}

function svgPath(text, opts){
  const border = (opts && opts.border != null) ? opts.border : 4;
  const { modules: m } = modules(text, opts && opts.mask);
  const size = m.length + border * 2;
  let path = '';
  for(let y = 0; y < m.length; y++) for(let x = 0; x < m.length; x++){
    if(m[y][x]) path += `M${x + border},${y + border}h1v1h-1z`;
  }
  return { size, path };
}

global.BoxIQQR = { svgPath, modules };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);

// This page lives at <site>/labels/, so the site root is one level up.
const ROOT = 'https://seedboxiq.github.io/boxiq/';  // flattened copy: site root is fixed
$('base').textContent = ROOT;

const normalize = raw => {
  let s = String(raw).toUpperCase().replace(/[^A-Z0-9]/g,'');
  const hit = s.match(/SG[A-Z0-9]+/);
  if(hit) s = hit[0];
  let tail = s.startsWith('SG') ? s.slice(2) : s;
  tail = tail.replace(/O/g,'0').replace(/[IL]/g,'1');
  if(/^\d+$/.test(tail) && tail.length < 8) tail = tail.padStart(8,'0');
  return /^\d{4,12}$/.test(tail) ? 'SG' + tail : '';
};

function qrSvg(url){
  const { size, path } = window.BoxIQQR.svgPath(url);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}"
          shape-rendering="crispEdges" role="img" aria-label="QR code"><path d="${path}" fill="currentColor"/></svg>`;
}

function label(kind, id, url, cap){
  return `<div class="label">
    <div class="kind">${kind}</div>
    <div class="qr">${qrSvg(url)}</div>
    <div>
      <div class="plate"><span class="rivet"></span><span class="id">${id}</span><span class="rivet"></span></div>
      <div class="cap">${cap}</div>
    </div>
  </div>`;
}

function build(){
  const slug = $('slug').value.trim().replace(/^\/|\/$/g,'');
  if(!slug){ $('slug').focus(); return; }
  const base = ROOT + slug + '/';
  const ids = [...new Set($('gates').value.split(/[\s,;]+/).map(normalize).filter(Boolean))];

  const parts = [];
  if($('sticker').checked)
    parts.push(label('Box sticker', 'Opens BoxIQ', base, 'Stick this on the Gen2 box sticker'));
  for(const id of ids)
    parts.push(label('Slidegate label', id, base + '?gate=' + id,
                     'One scan shows the seed in this box'));

  const sheet = $('sheet');
  sheet.className = $('style').value;
  if(!parts.length){
    sheet.innerHTML = '<div class="empty">No usable Gate IDs. They look like SG01001091.</div>';
  }else{
    sheet.innerHTML = parts.join('');
  }
  $('title').textContent = `${slug} — ${ids.length} gate${ids.length===1?'':'s'}` +
                           ($('sticker').checked ? ' + box sticker' : '');
  $('sub').textContent = `Codes point at ${base} · print at 100%, don't let the dialog scale it down.`;
  try{ localStorage.setItem('boxiq.labels', JSON.stringify({
    slug, gates: $('gates').value, style: $('style').value, sticker: $('sticker').checked })); }catch(e){}
}

async function loadAll(){
  const slug = $('slug').value.trim().replace(/^\/|\/$/g,'');
  const btn = $('loadAll'), was = btn.textContent;
  btn.textContent = 'Reading ' + slug + '/gates.csv…';
  try{
    const res = await fetch(ROOT + slug + '/gates.csv?v=' + Date.now());
    if(!res.ok) throw new Error(res.status);
    const rows = (await res.text()).trim().split(/\r?\n/).slice(1);
    const ids = [...new Set(rows.map(r => normalize(r.split(',')[0])).filter(Boolean))];
    if(!ids.length) throw new Error('no gate ids');
    $('gates').value = ids.join('\n');
    build();
  }catch(e){
    btn.textContent = "Couldn't read that folder's gates.csv";
    setTimeout(()=>{ btn.textContent = was; }, 2600);
    return;
  }
  btn.textContent = was;
}

$('build').addEventListener('click', build);
$('loadAll').addEventListener('click', loadAll);
$('print').addEventListener('click', ()=>{ build(); window.print(); });
$('form').addEventListener('keydown', e=>{ if(e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') build(); });

try{
  const saved = JSON.parse(localStorage.getItem('boxiq.labels') || 'null');
  if(saved){
    $('slug').value = saved.slug || 'aurora';
    $('gates').value = saved.gates || '';
    $('style').value = saved.style || 'cards';
    $('sticker').checked = saved.sticker !== false;
  }
}catch(e){}
build();
})();
</script>
</body>
</html>
