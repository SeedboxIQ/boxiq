<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BoxIQ label sheets</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1F211E; --ink-soft:#4A4E48; --seed:#8FB53C; --seed-deep:#5A7A1E;
    --plate:#F2F2EE; --steel:#6E7472; --steel-line:#C9CBC5; --page:#E4E5E0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 'Archivo',system-ui,sans-serif}
  .bar{background:var(--ink);color:var(--plate);padding:13px 0}
  .wrap{max-width:960px;margin:0 auto;padding:0 20px}
  .mark{font-weight:700;font-size:20px;letter-spacing:-.03em}
  .mark .sprout{color:var(--seed)}
  .mark .dot{color:var(--steel);padding:0 2px}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#9BA09A;margin-top:8px}

  form{background:#fff;border:1px solid var(--steel-line);border-radius:4px;padding:22px;margin:26px 0 22px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  label.f{display:block;margin-bottom:16px}
  label.f > span{
    display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.15em;
    text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;
  }
  input[type=text],textarea,select{
    width:100%;font:15px/1.45 'IBM Plex Mono',monospace;color:var(--ink);
    border:1.5px solid var(--steel-line);border-radius:3px;padding:11px 12px;background:var(--plate);
  }
  input:focus,textarea:focus,select:focus{outline:2px solid var(--seed);outline-offset:1px;border-color:var(--seed-deep)}
  textarea{min-height:104px;resize:vertical}
  .hint{font-size:12.5px;color:var(--ink-soft);margin:6px 0 0}
  .check{display:flex;align-items:center;gap:9px;margin:2px 0 18px;font-size:14.5px}
  .check input{width:18px;height:18px;accent-color:var(--seed-deep)}
  .btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  button{
    font:600 15px 'Archivo',sans-serif;border:1.5px solid var(--ink);border-radius:3px;
    padding:13px 18px;cursor:pointer;background:transparent;color:var(--ink);min-height:48px;
  }
  button.go{background:var(--seed);color:var(--ink)}
  button:focus-visible{outline:3px solid var(--seed-deep);outline-offset:2px}
  .note{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);margin-left:auto}

  h2.sheet-title{font-size:16px;margin:0 0 4px}
  p.sheet-sub{margin:0 0 20px;color:var(--ink-soft);font-size:13.5px}

  /* ---------- labels ---------- */
  #sheet{display:grid;gap:16px}
  #sheet.cards{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  #sheet.strips{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .label{background:#fff;border:1px solid var(--steel-line);border-radius:4px;padding:16px;break-inside:avoid}
  .label .kind{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel);margin-bottom:11px}
  .label .qr{color:var(--ink)}
  .label .qr svg{display:block;width:100%;height:auto}
  .plate{
    display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--plate);
    border:1px solid var(--steel-line);border-radius:3px;padding:6px 8px;margin-top:12px;
  }
  .rivet{width:9px;height:9px;border-radius:50%;flex:none;
    background:radial-gradient(circle at 35% 30%,#fff 0 18%,#B9BCB6 55%,#7E837C 100%)}
  .id{font:600 14px/1 'IBM Plex Mono',monospace;letter-spacing:.1em}
  .cap{font-size:11.5px;color:var(--ink-soft);margin-top:8px;line-height:1.35}

  #sheet.strips .label{display:grid;grid-template-columns:88px 1fr;gap:14px;align-items:center}
  #sheet.strips .kind{grid-column:1 / -1;margin:0}
  #sheet.strips .plate{margin:0}
  #sheet.strips .cap{margin:6px 0 0}

  .empty{background:#fff;border:1px dashed var(--steel-line);border-radius:4px;padding:26px;text-align:center;color:var(--ink-soft)}

  @media print{
    @page{ margin:12mm; }
    body{background:#fff}
    .bar,form,.screen-only{display:none !important}
    .wrap{max-width:none;padding:0}
    #sheet{gap:8mm}
    #sheet.cards{grid-template-columns:repeat(3,1fr)}
    #sheet.strips{grid-template-columns:repeat(2,1fr)}
    .label{border-color:#999;padding:5mm}
    #sheet.cards .qr svg{width:38mm}
    #sheet.strips .label{grid-template-columns:24mm 1fr}
  }
</style>
</head>
<body>

<div class="bar"><div class="wrap">
  <div class="mark">seedb<span class="sprout">o</span>x<span class="dot">·</span>BoxIQ</div>
  <div class="eyebrow">Label sheets</div>
</div></div>

<div class="wrap">
<form id="form" onsubmit="return false">
  <div class="row">
    <label class="f"><span>Client folder</span>
      <input type="text" id="slug" value="aurora" spellcheck="false" autocapitalize="off">
      <p class="hint">The folder name in the repo — <code>aurora</code>, <code>becks</code>, <code>bayer</code>.</p>
    </label>
    <label class="f"><span>Label style</span>
      <select id="style">
        <option value="cards">Cards — 3 across, big codes</option>
        <option value="strips">Strips — narrow, like the slidegate plate</option>
      </select>
      <p class="hint">Cards scan from further away. Strips fit on a gate.</p>
    </label>
  </div>

  <label class="f"><span>Gate IDs</span>
    <textarea id="gates" spellcheck="false" autocapitalize="characters">SG01001091
SG01001093</textarea>
    <p class="hint">One per line, or separated by commas. Bare digits are fine.</p>
  </label>

  <div class="check">
    <input type="checkbox" id="sticker" checked>
    <label for="sticker">Include the box sticker code (opens BoxIQ with nothing looked up)</label>
  </div>

  <div class="btns">
    <button type="button" class="go" id="build">Build sheet</button>
    <button type="button" id="loadAll">Load every gate in this client's list</button>
    <button type="button" id="print">Print</button>
    <span class="note" id="base"></span>
  </div>
</form>

<div class="screen-only">
  <h2 class="sheet-title" id="title">Nothing built yet</h2>
  <p class="sheet-sub" id="sub">Codes are live the moment the client folder is pushed to GitHub Pages.</p>
</div>

<div id="sheet" class="cards">
  <div class="empty">Set a client folder and gate IDs, then build the sheet.</div>
</div>
</div>

<script src="../assets/qr.js"></script>
<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);

// This page lives at <site>/labels/, so the site root is one level up.
const ROOT = new URL('..', location.href).href;
$('base').textContent = ROOT;

const normalize = raw => {
  let s = String(raw).toUpperCase().replace(/[^A-Z0-9]/g,'');
  const hit = s.match(/SG[A-Z0-9]+/);
  if(hit) s = hit[0];
  let tail = s.startsWith('SG') ? s.slice(2) : s;
  tail = tail.replace(/O/g,'0').replace(/[IL]/g,'1');
  if(/^\d+$/.test(tail) && tail.length < 8) tail = tail.padStart(8,'0');
  return /^\d{4,12}$/.test(tail) ? 'SG' + tail : '';
};

function qrSvg(url){
  const { size, path } = window.BoxIQQR.svgPath(url);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}"
          shape-rendering="crispEdges" role="img" aria-label="QR code"><path d="${path}" fill="currentColor"/></svg>`;
}

function label(kind, id, url, cap){
  return `<div class="label">
    <div class="kind">${kind}</div>
    <div class="qr">${qrSvg(url)}</div>
    <div>
      <div class="plate"><span class="rivet"></span><span class="id">${id}</span><span class="rivet"></span></div>
      <div class="cap">${cap}</div>
    </div>
  </div>`;
}

function build(){
  const slug = $('slug').value.trim().replace(/^\/|\/$/g,'');
  if(!slug){ $('slug').focus(); return; }
  const base = ROOT + slug + '/';
  const ids = [...new Set($('gates').value.split(/[\s,;]+/).map(normalize).filter(Boolean))];

  const parts = [];
  if($('sticker').checked)
    parts.push(label('Box sticker', 'Opens BoxIQ', base, 'Stick this on the Gen2 box sticker'));
  for(const id of ids)
    parts.push(label('Slidegate label', id, base + '?gate=' + id,
                     'One scan shows the seed in this box'));

  const sheet = $('sheet');
  sheet.className = $('style').value;
  if(!parts.length){
    sheet.innerHTML = '<div class="empty">No usable Gate IDs. They look like SG01001091.</div>';
  }else{
    sheet.innerHTML = parts.join('');
  }
  $('title').textContent = `${slug} — ${ids.length} gate${ids.length===1?'':'s'}` +
                           ($('sticker').checked ? ' + box sticker' : '');
  $('sub').textContent = `Codes point at ${base} · print at 100%, don't let the dialog scale it down.`;
  try{ localStorage.setItem('boxiq.labels', JSON.stringify({
    slug, gates: $('gates').value, style: $('style').value, sticker: $('sticker').checked })); }catch(e){}
}

async function loadAll(){
  const slug = $('slug').value.trim().replace(/^\/|\/$/g,'');
  const btn = $('loadAll'), was = btn.textContent;
  btn.textContent = 'Reading ' + slug + '/gates.csv…';
  try{
    const res = await fetch(ROOT + slug + '/gates.csv?v=' + Date.now());
    if(!res.ok) throw new Error(res.status);
    const rows = (await res.text()).trim().split(/\r?\n/).slice(1);
    const ids = [...new Set(rows.map(r => normalize(r.split(',')[0])).filter(Boolean))];
    if(!ids.length) throw new Error('no gate ids');
    $('gates').value = ids.join('\n');
    build();
  }catch(e){
    btn.textContent = "Couldn't read that folder's gates.csv";
    setTimeout(()=>{ btn.textContent = was; }, 2600);
    return;
  }
  btn.textContent = was;
}

$('build').addEventListener('click', build);
$('loadAll').addEventListener('click', loadAll);
$('print').addEventListener('click', ()=>{ build(); window.print(); });
$('form').addEventListener('keydown', e=>{ if(e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') build(); });

try{
  const saved = JSON.parse(localStorage.getItem('boxiq.labels') || 'null');
  if(saved){
    $('slug').value = saved.slug || 'aurora';
    $('gates').value = saved.gates || '';
    $('style').value = saved.style || 'cards';
    $('sticker').checked = saved.sticker !== false;
  }
}catch(e){}
build();
})();
</script>
</body>
</html>
